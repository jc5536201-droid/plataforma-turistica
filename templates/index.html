<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Rutas Turísticas de Coclé</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #f5f7fa; }
  #map { height: 100vh; width: 100%; }
  .panel {
    position: absolute; top: 15px; left: 15px; z-index: 1000;
    background: white; padding: 18px; border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15); width: 340px;
    max-height: calc(100vh - 30px); overflow-y: auto;
  }
  h1 { font-size: 18px; margin-bottom: 12px; color: #2c3e50; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 10px 0 4px; color: #555; }
  select, button {
    width: 100%; padding: 10px; border-radius: 8px;
    border: 1px solid #ddd; font-size: 14px; font-family: inherit;
  }
  button {
    background: #3498db; color: white; border: none; cursor: pointer;
    margin-top: 14px; font-weight: 600; transition: background 0.2s;
  }
  button:hover { background: #2980b9; }
  button:disabled { background: #95a5a6; cursor: not-allowed; }
  .resultado {
    margin-top: 15px; padding: 12px; background: #eaf4fc;
    border-left: 4px solid #3498db; border-radius: 6px;
    font-size: 13px; line-height: 1.7; display: none;
  }
  .resultado.visible { display: block; }
  .resultado strong { color: #2c3e50; }
  .error {
    margin-top: 12px; padding: 10px; background: #fdecea;
    border-left: 4px solid #e74c3c; border-radius: 6px;
    font-size: 13px; color: #c0392b; display: none;
  }
  .error.visible { display: block; }
  .loading {
    margin-top: 12px; padding: 10px; background: #fff8e1;
    border-left: 4px solid #f39c12; border-radius: 6px;
    font-size: 13px; color: #b9770e; display: none;
  }
  .loading.visible { display: block; }
</style>
</head>
<body>

<div id="map"></div>

<div class="panel">
  <h1>🗺️ Rutas Turísticas de Coclé</h1>

  <label for="origen">Origen</label>
  <select id="origen"></select>

  <label for="destino">Destino</label>
  <select id="destino"></select>

  <label for="criterio">Optimizar por</label>
  <select id="criterio">
    <option value="tiempo">⏱️ Tiempo</option>
    <option value="distancia">📏 Distancia</option>
    <option value="costo">💰 Costo</option>
  </select>

  <button id="btn-calcular">Calcular ruta</button>

  <div class="loading" id="loading">⏳ Calculando ruta... (puede tardar la primera vez)</div>
  <div class="error" id="error"></div>
  <div class="resultado" id="resultado"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ============================================================
// MAPA
// ============================================================
const map = L.map('map').setView([8.45, -80.35], 10);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap',
  maxZoom: 19,
}).addTo(map);

let capaRuta = null;
let marcadores = [];

// ============================================================
// CARGAR ATRACTIVOS
// ============================================================
const selOrigen = document.getElementById('origen');
const selDestino = document.getElementById('destino');
const btn = document.getElementById('btn-calcular');
const divResultado = document.getElementById('resultado');
const divError = document.getElementById('error');
const divLoading = document.getElementById('loading');

function mostrarError(msg) {
  divError.textContent = '❌ ' + msg;
  divError.classList.add('visible');
  divResultado.classList.remove('visible');
}

function ocultarError() {
  divError.classList.remove('visible');
}

function mostrarLoading(msg) {
  divLoading.textContent = msg || '⏳ Calculando...';
  divLoading.classList.add('visible');
}

function ocultarLoading() {
  divLoading.classList.remove('visible');
}

async function cargarAtractivos() {
  try {
    const res = await fetch('/api/coordenadas');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();

    // Llenar selects
    const opciones = Object.entries(data)
      .sort((a, b) => a[1].nombre.localeCompare(b[1].nombre))
      .map(([id, a]) => `<option value="${id}">${a.cod} - ${a.nombre}</option>`)
      .join('');
    selOrigen.innerHTML = opciones;
    selDestino.innerHTML = opciones;
    selDestino.selectedIndex = 1;

    // Marcadores en el mapa
    marcadores.forEach(m => map.removeLayer(m));
    marcadores = [];
    Object.entries(data).forEach(([id, a]) => {
      const m = L.marker([a.lat, a.lng])
        .addTo(map)
        .bindPopup(`<strong>${a.cod} - ${a.nombre}</strong><br><em>${a.tipo}</em><br>${a.descripcion}`);
      marcadores.push(m);
    });
  } catch (e) {
    console.error('Error cargando atractivos:', e);
    mostrarError('No se pudieron cargar los atractivos: ' + e.message);
  }
}

// ============================================================
// CALCULAR RUTA
// ============================================================
btn.addEventListener('click', async () => {
  ocultarError();
  divResultado.classList.remove('visible');

  const payload = {
    origen: parseInt(selOrigen.value),
    destino: parseInt(selDestino.value),
    criterio: document.getElementById('criterio').value,
  };

  if (payload.origen === payload.destino) {
    mostrarError('El origen y el destino no pueden ser iguales.');
    return;
  }

  btn.disabled = true;
  mostrarLoading('⏳ Calculando ruta...');

  try {
    const res = await fetch('/api/ruta', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });

    // Leer texto primero para evitar el error de JSON vacío
    const texto = await res.text();
    let data;
    try {
      data = JSON.parse(texto);
    } catch (e) {
      console.error('Respuesta no-JSON:', texto);
      throw new Error('El servidor respondió algo inesperado (status ' + res.status + ')');
    }

    if (!res.ok || !data.exito) {
      throw new Error(data.error || 'Error desconocido del servidor');
    }

    // Dibujar ruta
    if (capaRuta) map.removeLayer(capaRuta);
    if (data.puntos_ruta && data.puntos_ruta.length > 1) {
      capaRuta = L.polyline(data.puntos_ruta, {
        color: '#3498db', weight: 5, opacity: 0.8,
      }).addTo(map);
      map.fitBounds(capaRuta.getBounds(), { padding: [40, 40] });
    }

    // Resumen
    const paradas = data.nodos_ruta.map(n => `${n.cod}`).join(' → ');
    divResultado.innerHTML = `
      <strong>📍 Ruta:</strong> ${paradas}<br>
      <strong>📏 Distancia:</strong> ${data.distancia_km} km<br>
      <strong>⏱️ Tiempo:</strong> ${Math.round(data.tiempo_min)} min<br>
      <strong>💰 Costo estimado:</strong> $${data.costo}<br>
      <strong>🎯 Criterio:</strong> ${data.criterio}<br>
      <strong>🛑 Paradas:</strong> ${data.nodos_visitados}
    `;
    divResultado.classList.add('visible');

  } catch (e) {
    console.error(e);
    mostrarError(e.message);
  } finally {
    btn.disabled = false;
    ocultarLoading();
  }
});

// ============================================================
// INIT
// ============================================================
cargarAtractivos();
</script>
</body>
</html>
